name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # No DATABASE_URL is set here on purpose: the repository's DB-gated
        # integration tests (src/infrastructure/db/**/*.test.ts,
        # src/composition/dashboard-composition.test.ts) detect its absence
        # and skip themselves cleanly via describe.skipIf — they are not
        # weakened or rewritten, just not exercised on untrusted PRs.
        run: npm test

      - name: Build
        # next build evaluates src/lib/env.ts at module-load time (imported
        # transitively via the dashboard's composition root), which requires
        # a syntactically valid DATABASE_URL even though this route is
        # force-dynamic and is never actually rendered during the build
        # itself. These are inert placeholders with no reachable database
        # behind them, not a secret and not live Supabase credentials —
        # needed only to satisfy that format check.
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DEVELOPMENT_OWNER_ID: 00000000-0000-0000-0000-000000000001
